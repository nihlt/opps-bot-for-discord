name: Daily digest

on:
  schedule:
    # 08:00 Kyiv time -> 05:00 UTC in EEST (summer) / 06:00 UTC in EET
    # (winter). GitHub Actions cron is UTC-only and does not shift for
    # daylight saving, unlike node-cron's old CRON_SCHEDULE which ran in
    # the host machine's local time. Adjust this if a different local
    # trigger time is wanted.
    - cron: '0 5 * * *'
  workflow_dispatch: {}

# GitHub queues/skips overlapping runs of this group natively -- the same
# guarantee src/scheduler.js's in-memory `running` boolean used to provide,
# but process-independent now that there's no long-lived process at all.
concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # data/events.jsonl is .gitignore'd (Stage 0 decision -- runtime data
      # stays out of version control), so state persists across runs via
      # actions/cache instead of a git commit. restore-keys prefix-matches
      # the most recent prior run's save when there's no exact key hit.
      - name: Restore events store
        uses: actions/cache/restore@v4
        with:
          path: data/events.jsonl
          key: events-jsonl-${{ github.run_id }}
          restore-keys: |
            events-jsonl-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Write Vertex AI service account key
        run: echo "$CREDENTIALS_JSON" > "${{ runner.temp }}/gcp-key.json"
        env:
          CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}

      - name: Run pipeline
        run: node src/index.js
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          ADMIN_DISCORD_USER_IDS: ${{ secrets.ADMIN_DISCORD_USER_IDS }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_FEED_DATABASE_ID: ${{ secrets.NOTION_FEED_DATABASE_ID }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          GOOGLE_CLOUD_LOCATION: ${{ secrets.GOOGLE_CLOUD_LOCATION }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcp-key.json
          SCRAPE_CONCURRENCY: 3

      # Always-run, even on a failed pipeline step: whatever got
      # scraped/deduped before a later-stage crash still shouldn't be lost.
      # Accepted tradeoff: a crash between posting and this save step can
      # cause a rare duplicate post/Notion row next run -- chosen over the
      # alternative (saving right after dedupe, before posting), which
      # could silently lose an item forever if posting then failed.
      - name: Save events store
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/events.jsonl
          key: events-jsonl-${{ github.run_id }}
