name: Daily digest

on:
  schedule:
    # ~20:00 Kyiv time -> 17:07 UTC in EEST (summer) / 18:07 UTC in EET
    # (winter). GitHub Actions cron is UTC-only and does not shift for
    # daylight saving, so this drifts to 19:07/21:07 Kyiv depending on the
    # season -- pinned to the summer (EEST) offset since that's the
    # current season. Adjust if a different local trigger time is wanted.
    # Minute deliberately off :00 -- GitHub documents scheduled runs as
    # more prone to delay right at the top of the hour (queue load peaks
    # there); shifting by a few minutes reduces, but doesn't eliminate,
    # how late an actual run can start.
    - cron: '7 17 * * *'
  workflow_dispatch: {}

# GitHub queues/skips overlapping runs of this group natively -- the same
# guarantee src/scheduler.js's in-memory `running` boolean used to provide,
# but process-independent now that there's no long-lived process at all.
concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # data/events.jsonl and data/llm-usage.jsonl are both .gitignore'd
      # (Stage 0 decision -- runtime data stays out of version control),
      # so state persists across runs via actions/cache instead of a git
      # commit. restore-keys prefix-matches the most recent prior run's
      # save when there's no exact key hit. llm-usage.jsonl has to persist
      # the same way, or the weekly/monthly cost totals in the admin DM
      # would reset to zero every run.
      - name: Restore events store and LLM usage log
        uses: actions/cache/restore@v4
        with:
          path: |
            data/events.jsonl
            data/llm-usage.jsonl
          key: events-jsonl-${{ github.run_id }}
          restore-keys: |
            events-jsonl-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Write Vertex AI service account key
        run: echo "$CREDENTIALS_JSON" > "${{ runner.temp }}/gcp-key.json"
        env:
          CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}

      - name: Run pipeline
        run: node src/index.js
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          ADMIN_DISCORD_USER_IDS: ${{ secrets.ADMIN_DISCORD_USER_IDS }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_FEED_DATABASE_ID: ${{ secrets.NOTION_FEED_DATABASE_ID }}
          # Config, not credentials -- literal here (not secrets.*) so a
          # missing/wrong value shows up in a diff instead of silently
          # resolving to an empty string at runtime (a GitHub secret that
          # doesn't exist substitutes '', with no error).
          # DISCORD_TARGET=prod is what makes this the one place that ever
          # posts to DISCORD_CHANNEL_ID (prod) -- everywhere else (a local
          # run with no DISCORD_TARGET set) defaults to the test channel.
          # See src/discord/target.js.
          DISCORD_TARGET: prod
          GEMINI_MODEL: gemini-3.7-flash
          GOOGLE_CLOUD_PROJECT: gen-lang-client-0737937428
          GOOGLE_CLOUD_LOCATION: global
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcp-key.json
          SCRAPE_CONCURRENCY: 3

      # Always-run, even on a failed pipeline step: whatever got
      # scraped/deduped before a later-stage crash still shouldn't be lost.
      # Accepted tradeoff: a crash between posting and this save step can
      # cause a rare duplicate post/Notion row next run -- chosen over the
      # alternative (saving right after dedupe, before posting), which
      # could silently lose an item forever if posting then failed.
      - name: Save events store and LLM usage log
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/events.jsonl
            data/llm-usage.jsonl
          key: events-jsonl-${{ github.run_id }}
